[tool.ruff]
line-length = 120
target-version = "py39"
exclude = [
  ".git",
  ".venv",
  "venv",
  "__pycache__",
  ".pytest_cache",
  ".ruff_cache",
  "instance",
  "repos",
  "logs",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]
"tests/**/*.py" = ["E402", "F401"]
# scripts/ 下的都是「直接 python scripts/X.py 执行」的入口脚本，必须在 import
# 之前先把仓库根插进 sys.path（脚本的 sys.path[0] 是 scripts/，不是仓库根），
# 这与 app.py 需要 E402 是同一类情况。
"scripts/**/*.py" = ["E402"]

# ==========================================================================
# pytest 配置文件
#
# 【段头必须是 [pytest]】
#   写成 [tool:pytest] 只对 setup.cfg / tox.ini 有效；放在 pytest.ini 里
#   该段头会被整体忽略，下面的 testpaths / addopts / minversion 全部失效。
#
#   实测证据（pytest 自己的解析结果，不是推断）：
#       inifile      = ...\ExcelDiff_ForGame\pytest.ini   ← 文件被认到了
#       testpaths    = []        ← 应为 ['tests']
#       addopts      = []        ← 应为 ['-s', '--tb=short']
#       minversion   = ''        ← 应为 '6.0'
#   （python_files 有值只是因为它恰好等于 pytest 的默认值，并非读自本文件。）
#
#   症状：裸跑 `pytest` 不会只收集 tests/，而是从 rootdir 递归收集。
#   当前之所以没炸，只是因为 tests/ 之外恰好还没有 test_*.py；一旦装上 venv、
#   或 clone 了 repos/、或 agent/ 下出现 test_*.py，就会扫到第三方自带测试，
#   收集期报 ImportError → "Interrupted: 1 error during collection"
#   → **0 个测试执行**（看起来像"全绿"，实际什么都没跑）。
# ==========================================================================
[pytest]

# 只收集 tests/ 目录（裸跑 `pytest` 不再递归整个仓库）
testpaths = tests

python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# 不递归的目录。
# 注意：collect_ignore **不是 ini 选项**（pytest.ini 里写它只会得到
# PytestConfigWarning: Unknown config option），排除目录要用 norecursedirs。
# 原先那行 `collect_ignore = app.py test_app.py venv instance repos logs ...`
# 既无效又会误导后来者以为这些已经被排除了。
#
# 文件级排除（app.py / test_app.py）不需要写在这里：它们不匹配
# python_files 的 test_*.py / *_test.py，本来就不会被收集。
norecursedirs = venv .venv env instance repos logs .pytest_tmp tests/_pytest_tmp_run __pycache__ .git .mypy_cache .ruff_cache

# 输出与最小版本
#   -s 保留（原意是实时可见输出，tests/conftest.py 的流保护与它配套）。
#   若某次运行输出过于嘈杂，可在命令行用 `-o addopts=--tb=short` 临时覆盖，
#   而不要写成 `-p no:capture`：实测 `-s` 与 `-p no:capture` 并存时，
#   consider_preparse 阶段 capture 插件被 block 掉、`-s` 无人识别，
#   直接 usage error —— 同样是 0 个测试执行。
addopts = -s --tb=short

# 并发跑（**不写进 addopts**）。整轮约 5900 条，串行 ~3 分半 ——
#     python -m pytest -q -n 8 --dist loadfile
# `-s` 与 xdist 并存没问题；输出各 worker 交错，看失败详情用 `-n 0` 的重跑。
#
# 【为什么是 --dist loadfile 而不是默认的 load】
#   默认的 load 把**同一个文件里的用例**也摊到不同 worker 上。现在这样跑是绿的
#   （实测过），但那意味着「文件内共享状态」暂时没被依赖 —— 而不是不会发生：
#   每个 worker 有**自己那份** session 级临时库（tests/conftest.py 按进程造），
#   文件内前后用例共用一个库这件事只在同一条 worker 里成立。用 loadfile 把整文件
#   钉在一条 worker 上，文件内顺序与串行完全一致，跨文件才是并发的 —— 那正是
#   「不会相互影响的逻辑」的边界。
#
# 【不放进 addopts 的理由】
#   写进去就等于所有 pytest 运行都硬依赖 pytest-xdist —— 没装（或没按
#   requirements-dev.txt 重装）时连单跑一个文件都会 directly 报 unknown option。
#   并发是加速手段，不该变成「跑不了测试」的原因。
#
# 【并发下更要写死的两件事】
#   1. 断言别依赖「本进程之前跑过什么」—— 每条 worker 的库是新的，别的前提都可能不同；
#   2. 需要「某个条件下才成立」的前提时，**换一个满足前提的输入**，不要 pytest.skip：
#      并发下跳过会变成常态（实测 test_ai_job_settlement_and_scope.py 里那条跨表
#      id 撞车的用例就是这样 —— 断言没跑却报绿）。

minversion = 6.0

# 自定义标记。**不在这里登记就会有 PytestUnknownMarkWarning**，而 `-m` 选择器在
# strict-markers 下会直接报错，所以标记必须先声明再使用。
markers =
    live: 需要真实外部依赖（本地 AI 代理等）的用例。依赖不在时自动 skip，
        因此 CI 与别人的机器上不会失败；本机想跳过它们用 `-m "not live"`，
        想只跑它们用 `-m live`。

